name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine site URL and base path
        id: pages-meta
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          USER_SITE="${OWNER}.github.io"
          
          SITE_URL="https://${OWNER}.github.io"
          if [ "$REPO" = "$USER_SITE" ]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${REPO}"
          fi
          
          echo "site_url=$SITE_URL" >> $GITHUB_OUTPUT
          echo "base_path=$BASE_PATH" >> $GITHUB_OUTPUT
          echo "Configured SITE_URL=$SITE_URL and BASE_PATH=$BASE_PATH"

      - name: Build with Astro
        env:
          SITE_URL: ${{ steps.pages-meta.outputs.site_url }}
          BASE_PATH: ${{ steps.pages-meta.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
